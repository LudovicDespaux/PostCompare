name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  test:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      java-version: '17'
      npm-lock: frontend/package-lock.json
      artifact-path: backend/target/postcompare-0.1.0.jar
      command: |
        cd frontend
        npm ci
        npm run build
        cd ..
        node scripts/write-build-info.cjs
        cd backend
        mvn -B -ntp clean verify
        cd ..
        for script in deploy/*.sh; do bash -n "$script"; done
        python3 deploy/test-hardening.py
        python3 deploy/test-ci-receive.py
        docker build -t postcompare:ci .
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      artifact-file: postcompare-0.1.0.jar
      public-url: http://91.134.138.53
    # Required for environment secrets on current runners: actions/runner#4453.
    # Production remains restricted to main; keep unrelated secrets out of this repo.
    secrets: inherit
